name: Fetch SENSEX expiry + daily 1-min data

# Two pulls, every weekday after close:
#  1. expiry_data/ - the CAS-freeze study, only on an ACTUAL SENSEX expiry day
#     (the puller checks Upstox's live instrument master itself - see
#     cas_expiry_common.py - so no weekday is hardcoded here; a holiday shift
#     or a SEBI expiry-day change just works, no edits needed).
#  2. 1min_download/ - the front-week ATM+/-band option chain, EVERY trading
#     day regardless of expiry, so that data isn't lost once the week's
#     contract rolls off Upstox's free API at expiry.
#
# Offset 5 min from the NIFTY workflow (fetch-nifty-expiry.yml) so the two
# rarely race on the same push; either way both rebase before pushing.
on:
  schedule:
    - cron: "20 10 * * 1-5"   # 15:50 IST, Mon-Fri
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch SENSEX expiry CAS data (no-op if today isn't a listed expiry)
        id: fetch
        run: |
          OUT="$(python3 fetch_sensex_expiry_cas.py 2>&1)"
          echo "$OUT"
          FOLDER="$(echo "$OUT" | grep '^FOLDER=' | cut -d= -f2-)"
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"

      - name: Build ATM collage
        if: steps.fetch.outputs.folder != ''
        run: python3 collage_atm_cas.py "${{ steps.fetch.outputs.folder }}"

      - name: Fetch daily 1-min front-week archive (every trading day)
        run: python3 fetch_sensex_daily_1min.py

      - name: Commit and push new data (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- expiry_data 1min_download
          if git diff --cached --quiet; then
            echo "No new SENSEX data to commit."
          else
            git commit -m "Auto-fetch: SENSEX data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin main
            git push
          fi
